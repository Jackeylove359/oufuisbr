<!DOCTYPE html>
<html lang="en">
<!-- feedback.html: 客户反馈 - 评分表单(验证) + 反馈列表 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Infomedia</title>
  <meta name="description" content="Share your feedback with Infomedia. Rate our products and services.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header-mount"></div>
  <main>
    <section class="page-header">
      <h1>Customer Feedback</h1>
      <p>Your voice shapes how we improve</p>
    </section>
    <section class="section">
      <div class="container">
        <div class="feedback-grid">
          <!-- 左侧：反馈表单 -->
          <div class="feedback-form-card">
            <h3 class="feedback-title"><i class="fa-solid fa-comment-dots"></i> Share Your Feedback</h3>
            <form id="feedbackForm" onsubmit="event.preventDefault(); Feedback.submitFeedback();">
              <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" class="form-control" id="fbName" placeholder="Your name"
                       oninput="Validation.clearFieldError('fbName')">
              </div>
              <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" class="form-control" id="fbEmail" placeholder="you@dealer.com"
                       oninput="Validation.clearFieldError('fbEmail')">
              </div>
              <div class="form-group">
                <label>Phone <span class="required">*</span></label>
                <input type="text" class="form-control" id="fbPhone" placeholder="+61 4xx xxx xxx"
                       oninput="Validation.clearFieldError('fbPhone')">
              </div>
              <!-- 5 星评分组件 -->
              <div class="form-group">
                <label>Rating <span class="required">*</span></label>
                <div class="star-rating" id="starRating">
                  <i class="fa-solid fa-star star" data-value="1" onclick="Feedback.setRating(1)"></i>
                  <i class="fa-solid fa-star star" data-value="2" onclick="Feedback.setRating(2)"></i>
                  <i class="fa-solid fa-star star" data-value="3" onclick="Feedback.setRating(3)"></i>
                  <i class="fa-solid fa-star star" data-value="4" onclick="Feedback.setRating(4)"></i>
                  <i class="fa-solid fa-star star" data-value="5" onclick="Feedback.setRating(5)"></i>
                </div>
                <input type="hidden" id="fbRating" value="0">
                <div class="field-error" id="fbRating-error">Please select at least 1 star</div>
              </div>
              <div class="form-group">
                <label>Comment <span class="required">*</span></label>
                <textarea class="form-control" id="fbComment" placeholder="Tell us what you think..."
                          oninput="Validation.clearFieldError('fbComment')"></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-full">
                <i class="fa-solid fa-paper-plane"></i> Submit Feedback
              </button>
            </form>
          </div>
          <!-- 右侧：反馈列表（提交后展示） -->
          <div class="feedback-sidebar">
            <h3 class="feedback-title"><i class="fa-solid fa-comments"></i> Recent Feedback</h3>
            <div class="feedback-list" id="feedbackList">
              <!-- 由 Feedback.renderFeedbackList 动态渲染 -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-mount"></div>
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/main.js"></script>
  <script>
    /**
     * 反馈页面逻辑（内联脚本，使用 ES6+ 特性）
     * 包含：星级评分交互、表单验证、反馈列表渲染
     */
    const Feedback = {
      // 当前选中的评分（ES6 let 可变状态）
      currentRating: 0,
      /**
       * 设置评分（ES6 箭头函数）
       * 点击星星后高亮选中
       */
      setRating: (value) => {
        Feedback.currentRating = value;
        document.getElementById('fbRating').value = value;
        // 清除错误
        const err = document.getElementById('fbRating-error');
        if (err) err.classList.remove('show-error');
        // ES6: forEach 遍历星星更新高亮状态
        document.querySelectorAll('#starRating .star').forEach((star) => {
          const starValue = Number(star.dataset.value);
          if (starValue <= value) {
            star.classList.add('active');
          } else {
            star.classList.remove('active');
          }
        });
      },
      /**
       * 提交反馈（ES6 解构赋值 + 验证 + localStorage 存储）
       */
      submitFeedback: () => {
        // ES6: 收集表单值
        const name = document.getElementById('fbName').value.trim();
        const email = document.getElementById('fbEmail').value.trim();
        const phone = document.getElementById('fbPhone').value.trim();
        const comment = document.getElementById('fbComment').value.trim();
        const rating = Number(document.getElementById('fbRating').value);
        // ES6: 统一表单验证
        const isValid = Validation.validateForm([
          { fieldId: 'fbName', value: name, type: 'required', message: 'Name is required' },
          { fieldId: 'fbEmail', value: email, type: 'email', message: 'Please enter a valid email' },
          { fieldId: 'fbPhone', value: phone, type: 'phone', message: 'Please enter a valid phone number' },
          { fieldId: 'fbComment', value: comment, type: 'required', message: 'Comment is required' }
        ]);
        // 评分单独验证（至少 1 星）
        if (!Validation.validateRating(rating)) {
          const err = document.getElementById('fbRating-error');
          if (err) err.classList.add('show-error');
          return;
        }
        if (!isValid) return;
        // 保存到 localStorage（ES6 展开运算符）
        Storage.addFeedback({ name, email, phone, rating, comment });
        Main.showToast('Thank you for your feedback!', 'success');
        // 重置表单
        document.getElementById('feedbackForm').reset();
        Feedback.currentRating = 0;
        document.querySelectorAll('#starRating .star').forEach((s) => s.classList.remove('active'));
        // 刷新反馈列表
        Feedback.renderFeedbackList();
      },
      /**
       * 渲染反馈列表（ES6 模板字面量）
       */
      renderFeedbackList: () => {
        const list = document.getElementById('feedbackList');
        if (!list) return;
        const feedbacks = Storage.getFeedbacks();
        // 空状态
        if (feedbacks.length === 0) {
          list.innerHTML = `
            <div class="empty-cart">
              <i class="fa-solid fa-inbox"></i>
              <h3>No feedback yet</h3>
              <p>Be the first to share your thoughts!</p>
            </div>`;
          return;
        }
        // ES6: map 生成反馈卡片
        list.innerHTML = feedbacks
          .map((fb) => {
            // ES6: 解构赋值
            const { name, rating, comment, date } = fb;
            // 生成星星（ES6: repeat 模拟）
            const stars = '<i class="fa-solid fa-star"></i>'.repeat(rating) +
                          '<i class="fa-regular fa-star"></i>'.repeat(5 - rating);
            // ES6: 模板字面量
            return `
              <div class="feedback-card">
                <div class="header">
                  <span class="name">${name}</span>
                  <span class="stars">${stars}</span>
                </div>
                <p class="comment">${comment}</p>
                <p class="meta"><i class="fa-regular fa-clock"></i> ${new Date(date).toLocaleString()}</p>
              </div>`;
          })
          .join('');
      }
    };
    window.Feedback = Feedback;
    // 初始化反馈列表（ES6 DOMContentLoaded）
    document.addEventListener('DOMContentLoaded', () => {
      Feedback.renderFeedbackList();
    });
  </script>
</body>
</html>
