<!DOCTYPE html>
<html lang="en">
<!-- admin.html: 后台管理 - 登录 + 产品CRUD + 客户注册 + 购物车管理 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Infomedia</title>
  <meta name="description" content="Infomedia admin portal: manage products, customers, and carts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-mount"></div>

  <main>
    <section class="page-header">
      <h1>Admin Portal</h1>
      <p>Manage products, customers, and orders</p>
    </section>

    <section class="section">
      <div class="container">
        <!-- 登录界面（未登录时显示） -->
        <div class="admin-login-wrap" id="adminLoginWrap">
          <h2><i class="fa-solid fa-shield-halved" style="color:var(--electric);"></i> Admin Login</h2>
          <p class="subtitle">Sign in to access the management console</p>
          <form id="adminLoginForm" onsubmit="event.preventDefault(); Admin.adminLogin();">
            <div class="form-group">
              <label>Username <span class="required">*</span></label>
              <input type="text" class="form-control" id="adminLoginUser" placeholder="Enter admin username"
                     oninput="Validation.clearFieldError('adminLoginUser')">
            </div>
            <div class="form-group">
              <label>Password <span class="required">*</span></label>
              <input type="password" class="form-control" id="adminLoginPass" placeholder="Enter admin password"
                     oninput="Validation.clearFieldError('adminLoginPass')">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">
              <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
          </form>
          <p class="hint" style="margin-top:20px; padding:12px; background:var(--bg); border-radius:8px; font-size:0.85rem; color:var(--text-muted);">
            <i class="fa-solid fa-circle-info"></i> Demo credentials: <strong>admin</strong> / <strong>admin123</strong>
          </p>
        </div>

        <!-- 管理后台主面板（登录后显示，由 admin.js 动态渲染） -->
        <div class="admin-layout hidden" id="adminPanel">
          <!-- 左侧标签菜单 -->
          <div class="admin-tabs">
            <div class="admin-tab active" data-tab="products" onclick="Admin.switchTab('products')">
              <i class="fa-solid fa-box"></i> Products
            </div>
            <div class="admin-tab" data-tab="customers" onclick="Admin.switchTab('customers')">
              <i class="fa-solid fa-users"></i> Customers
            </div>
            <div class="admin-tab" data-tab="register" onclick="Admin.switchTab('register')">
              <i class="fa-solid fa-user-plus"></i> Register
            </div>
            <div class="admin-tab" data-tab="carts" onclick="Admin.switchTab('carts')">
              <i class="fa-solid fa-cart-flatbed"></i> Carts
            </div>
          </div>

          <!-- 右侧操作区（由 admin.js 根据标签动态填充） -->
          <div class="admin-panel" id="adminContent"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // 初始化后台页（检查登录状态）
    document.addEventListener('DOMContentLoaded', () => {
      Admin.initAdminPage();
    });
  </script>
</body>
</html>
